[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pharos-rx"
version = "1.0.0"
description = "Cohort-grounded retrieval-augmented synthesis over 215,063 patient drug reviews, with stratified evidence sampling, computed pharmacovigilance statistics, and claim-level verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaiah" }]
keywords = [
    "retrieval-augmented-generation",
    "langchain",
    "langgraph",
    "pharmacovigilance",
    "clinical-nlp",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ---------------------------------------------------------------------------
# The base install is intentionally light. Everything in the "reproducible
# core" -- ingestion, cleaning, segmentation, indexing, retrieval, and the
# entire non-generative half of the evaluation suite -- runs on these deps
# alone, with no model downloads and no API keys.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "orjson>=3.9",
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Transformer encoders for the headline retrieval numbers.
encoders = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Generative back-ends. Any one of these is sufficient.
anthropic = ["langchain-anthropic>=0.2"]
openai = ["langchain-openai>=0.2"]
ollama = ["langchain-ollama>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]
all = ["pharos-rx[encoders,anthropic,openai,ollama,dev]"]

[project.scripts]
pharos = "pharos.cli:app"

[project.urls]
Homepage = "https://github.com/ocansey/pharos-rx"
Documentation = "https://github.com/ocansey/pharos-rx/blob/main/docs/METHODS.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pharos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that build a full index (deselect with '-m \"not slow\"')",
    "llm: tests that require a live generative back-end",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag typographic characters (en dash, multiplication sign) as
# "ambiguous". They are deliberate in prose docstrings and tables; degrading
# them to ASCII would make the documentation worse to read.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/pharos"]
omit = ["*/cli.py"]
